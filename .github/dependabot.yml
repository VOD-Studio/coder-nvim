version: 2
updates:
  # GitHub Actions 版本 —— 用 chore(ci)，不触发 release（仅累积到下次发版）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    labels: [dependencies]

  # 根 Dockerfile 的基础镜像/ARG —— 用 fix(deps)，会触发 patch release 重新构建镜像
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: fix(deps)
    labels: [dependencies]

  # xfy-nvim 子镜像
  - package-ecosystem: docker
    directory: /xfy-nvim
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: fix(deps)
    labels: [dependencies]
