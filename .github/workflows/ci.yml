name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# 同一分支新提交取消旧的运行，节省 runner 分钟
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) 提交信息必须遵循 Conventional Commits —— release-please 的基础
  commitlint:
    name: Commit lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  # 2) Terraform：格式检查 + 校验（init 会拉取 coder/docker provider 与 code-server 模块）
  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.9
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate -no-color

  # 3) Docker 冒烟构建：两个镜像各构建 amd64（不推送），验证 Dockerfile 可编译
  docker-build:
    name: docker build (${{ matrix.image }} / amd64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: rocky-dev, context: "." }
          - { image: xfy-nvim, context: "xfy-nvim" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.image }}:ci
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64
